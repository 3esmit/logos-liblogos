name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Nix
      # v27 ships Nix 2.22, which is old enough to mis-handle several flake
      # locking features (notably nested `a.inputs.b.inputs.c.follows` and the
      # precedence of an --override-input'd input's own lock). v31 ships 2.35,
      # matching what logos-standalone-app already uses.
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - uses: cachix/cachix-action@v15
      with:
        name: logos-co
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Build logos-liblogos-tests
      run: nix build .#logos-liblogos-tests

    # Run the check, not ./result/bin directly: only the check supplies
    # TEST_PLUGIN and the dependency-range fixture. Without them the nine
    # real-plugin tests SKIP, and a skip renders as a pass -- a green CI that
    # proves nothing about the discovery -> gate path.
    - name: Run logos_core_tests
      run: nix build -L ".#checks.$(nix eval --impure --raw --expr builtins.currentSystem).tests"
